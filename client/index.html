<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="มัลติเล่า มัลติฟัง Talk With Duck — พื้นที่ปลอดภัยของคนในสาขา ปี 1–4 คุยด้วยเสียง 1-1 หรือเป็นกลุ่ม ร้องคาราโอเกะด้วยกัน และฝากคำถามให้เพื่อนกับรุ่นพี่ช่วยตอบ ไม่ต้องใช้ชื่อจริง" />
    <meta name="theme-color" content="#FFC93C" />
    <!-- ตัวอย่างลิงก์ตอนแชร์ใน LINE/Facebook · og:image ใส่ตอน build เมื่อรู้โดเมน (vite.config.js) -->
    <!-- ไม่ใส่ og:url: Facebook จะพาไปหน้าแรกแทนลิงก์ห้องที่เพื่อนแชร์มา -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="มัลติเล่า มัลติฟัง · Talk With Duck" />
    <meta property="og:title" content="มัลติเล่า มัลติฟัง · Talk With Duck" />
    <meta property="og:description" content="อยากเล่าก็เล่า อยากฟังก็ฟัง พื้นที่ปลอดภัยของคนในสาขา ปี 1–4 คุยด้วยเสียง ร้องคาราโอเกะ และฝากคำถามได้โดยไม่ต้องใช้ชื่อจริง" />
    <link rel="icon" type="image/svg+xml" href="/duck.svg" />
    <title>มัลติเล่า มัลติฟัง · Talk With Duck</title>
    <script>
      // ใส่โหมดสว่าง/มืดที่ผู้ใช้เลือกไว้ก่อนหน้าเว็บวาด จอจะได้ไม่กระพริบเป็นสีสว่างก่อน
      // ทำแบบเดียวกับ applyTheme ใน src/lib/theme.js (แก้ที่หนึ่งต้องแก้อีกที่ด้วย)
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('twd-theme') || 'system';
        } catch {
          // ปิด localStorage ไว้: ใช้ตามเครื่อง
        }
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1814');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
